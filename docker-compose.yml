services:
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # Код из образа (см. .dockerignore: без read.txt, docs/ и т.д.).
    # Локальная разработка с hot-reload: создайте docker-compose.override.yml:
    #   services:
    #     bot:
    #       volumes: ["./:/app:rw"]
    volumes:
      - ./bot/settings.json:/app/bot/settings.json
    command: python -m bot.main
